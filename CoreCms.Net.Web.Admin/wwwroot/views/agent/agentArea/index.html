<title>地区代理管理</title>
<!--当前位置开始-->
<div class="layui-card layadmin-header">
    <div class="layui-breadcrumb" lay-filter="breadcrumb">
        <script type="text/html" template lay-done="layui.data.updateMainBreadcrumb();">
        </script>
    </div>
</div>
<!--当前位置结束-->
<style>
    /* 重写样式 */
    .layui-table-tool-temp .layui-btn {
        margin-right: 3px;
        margin-bottom: 3px;
    }
    .layui-table-tool-temp {
        white-space: nowrap;
    }
    /* 确保按钮样式正确加载 */
    .layui-btn-xs {
        height: 22px;
        line-height: 22px;
        padding: 0 5px;
        font-size: 12px;
    }
    /* 按钮组样式优化 */
    .layui-btn-group .layui-btn {
        margin-right: 0;
        border-radius: 0;
    }
    .layui-btn-group .layui-btn:first-child {
        border-top-left-radius: 2px;
        border-bottom-left-radius: 2px;
    }
    .layui-btn-group .layui-btn:last-child {
        border-top-right-radius: 2px;
        border-bottom-right-radius: 2px;
    }
    /* 防止按钮重复显示 */
    .layui-table-tool-temp .layui-btn-group {
        display: inline-block;
        vertical-align: top;
    }
</style>
<script type="text/html" template lay-type="Post" lay-url="{{ layui.setter.apiUrl }}Api/CoreCmsAgentArea/GetIndex" lay-done="layui.data.done(d);">
    
</script>
<div class="table-body">
    <table id="LAY-app-CoreCmsAgentArea-tableBox" lay-filter="LAY-app-CoreCmsAgentArea-tableBox"></table>
</div>

<script type="text/html" id="LAY-app-CoreCmsAgentArea-toolbar">
    <div class="layui-form coreshop-toolbar-search-form">
        <div class="layui-form-item">
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <input type="text" name="agentName" placeholder="请输入代理商名称" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <select name="areaDepth">
                        <option value="">请选择地区层级</option>
                        <option value="1">省级代理</option>
                        <option value="2">市级代理</option>
                        <option value="3">县级代理</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <input type="text" name="areaName" placeholder="请输入地区名称" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <select name="isEnable">
                        <option value="">请选择启用状态</option>
                        <option value="true">启用</option>
                        <option value="false">禁用</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <button class="layui-btn layui-btn-sm" lay-submit lay-filter="LAY-app-CoreCmsAgentArea-search"><i class="layui-icon layui-icon-search"></i>筛选</button>
            </div>
        </div>
    </div>
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="addData"><i class="layui-icon layui-icon-add-1"></i>添加地区代理</button>
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="batchSettle"><i class="layui-icon layui-icon-dollar"></i>批量结算</button>
    </div>
</script>

<script type="text/html" id="LAY-app-CoreCmsAgentArea-tableBox-bar">
    <div class="layui-btn-group">
        <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="detail" title="查看详情">查看</a>
        <a class="layui-btn layui-btn-xs" lay-event="edit" title="编辑代理信息">编辑</a>
        <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="setCommission" title="设置佣金比例">设置佣金</a>
        <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="viewOrders" title="查看代理订单">查看订单</a>
        {{# if(d.isEnable){ }}
        <a class="layui-btn layui-btn-disabled layui-btn-xs" lay-event="setEnable" data-enable="false" title="禁用代理">禁用</a>
        {{# } else { }}
        <a class="layui-btn layui-btn-xs" lay-event="setEnable" data-enable="true" title="启用代理">启用</a>
        {{# } }}
        <a class="layui-btn layui-btn-danger layui-btn-xs" data-dropdown="#CoreCmsAgentAreaTbDelDrop{{d.LAY_NUM}}" no-shade="true" title="删除代理">删除</a>
    </div>
    <div class="dropdown-menu-nav dropdown-popconfirm dropdown-top-right layui-hide" id="CoreCmsAgentAreaTbDelDrop{{d.LAY_NUM}}"
         style="max-width: 200px;white-space: normal;min-width: auto;margin-left: 10px;">
        <div class="dropdown-anchor"></div>
        <div class="dropdown-popconfirm-title">
            <i class="layui-icon layui-icon-help"></i>
            确定要删除【{{d.agentName}}】的地区代理权限吗？
        </div>
        <div class="dropdown-popconfirm-btn">
            <a class="layui-btn layui-btn-primary cursor" btn-cancel>取消</a>
            <a class="layui-btn layui-btn-normal cursor" lay-event="del">确定</a>
        </div>
    </div>
</script>

<script>
    var indexData;
    var debug = layui.setter.debug;
    layui.data.done = function (d) {
        //开启调试情况下获取接口赋值数据
        if (debug) {
            console.log(d);
        }
        indexData = d.data;
    };

    layui.use(['table', 'form', 'layer'], function () {
        var $ = layui.$
            , admin = layui.admin
            , table = layui.table
            , form = layui.form
            , layer = layui.layer;

        //监听搜索
        form.on('submit(LAY-app-CoreCmsAgentArea-search)', function (data) {
            var field = data.field;
            //执行重载
            table.reload('LAY-app-CoreCmsAgentArea-tableBox', {
                where: field
            });
        });

        //事件
        var active = {
            batchdel: function () {
                var checkStatus = table.checkStatus('LAY-app-CoreCmsAgentArea-tableBox')
                    , checkData = checkStatus.data; //得到选中的数据

                if (checkData.length === 0) {
                    return layer.msg('请选择数据');
                }

                layer.prompt({
                    formType: 1
                    , title: '敏感操作，请验证口令'
                }, function (value, index) {
                    if (value === '') {
                        layer.msg('请填写口令');
                        return false;
                    }
                    if (value !== 'delete') {
                        layer.msg('口令不正确');
                        return false;
                    }
                    layer.close(index);

                    var ids = [];
                    layui.each(checkData, function (index, item) {
                        ids.push(item.id);
                    });
                    admin.req({
                        url: layui.setter.apiUrl + "Api/CoreCmsAgentArea/DoBatchDelete"
                        , data: {
                            ids: ids
                        }
                        , type: 'POST'
                        , success: function (res) {
                            if (res.code === 0) {
                                layer.msg(res.msg);
                                table.reload('LAY-app-CoreCmsAgentArea-tableBox');
                            } else {
                                layer.msg(res.msg);
                            }
                        }
                    });
                });
            },
            addData: function () {
                admin.popup({
                    type: 2
                    , title: '添加地区代理'
                    , content: layui.setter.views + 'agent/agentArea/create.html'
                    , maxmin: true
                    , area: ['800px', '600px']
                    , success: function(layero, index) {
                        // 确保弹窗内容加载完成后重新渲染表单
                        var iframeWin = window[layero.find('iframe')[0]['name']];
                        if (iframeWin && iframeWin.layui) {
                            iframeWin.layui.form.render();
                        }
                    }
                });
            },
            batchSettle: function () {
                var checkStatus = table.checkStatus('LAY-app-CoreCmsAgentArea-tableBox')
                    , checkData = checkStatus.data;

                if (checkData.length === 0) {
                    return layer.msg('请选择要结算的代理商');
                }

                layer.confirm('确定要对选中的代理商进行批量结算吗？', function (index) {
                    var ids = [];
                    layui.each(checkData, function (index, item) {
                        ids.push(item.id);
                    });
                    admin.req({
                        url: layui.setter.apiUrl + "Api/CoreCmsAgentArea/DoBatchSettle"
                        , data: {
                            ids: ids
                        }
                        , type: 'POST'
                        , success: function (res) {
                            if (res.code === 0) {
                                layer.msg(res.msg);
                                table.reload('LAY-app-CoreCmsAgentArea-tableBox');
                            } else {
                                layer.msg(res.msg);
                            }
                        }
                    });
                    layer.close(index);
                });
            }
        };

        // 确保按钮点击事件不重复绑定
        $('.layui-btn-container .layui-btn').off('click').on('click', function () {
            var type = $(this).data('type');
            active[type] ? active[type].call(this) : '';
        });

        //监听工具条
        table.on('tool(LAY-app-CoreCmsAgentArea-tableBox)', function (obj) {
            var data = obj.data;
            if (obj.event === 'detail') {
                admin.popup({
                    type: 2
                    , title: '查看地区代理详情'
                    , content: layui.setter.views + 'agent/agentArea/details.html?id=' + data.id
                    , maxmin: true
                    , area: ['800px', '600px']
                });
            } else if (obj.event === 'del') {
                admin.req({
                    url: layui.setter.apiUrl + "Api/CoreCmsAgentArea/DoDelete"
                    , data: {
                        id: data.id
                    }
                    , type: 'POST'
                    , success: function (res) {
                        if (res.code === 0) {
                            obj.del();
                            layer.msg(res.msg);
                        } else {
                            layer.msg(res.msg);
                        }
                    }
                });
            } else if (obj.event === 'edit') {
                admin.popup({
                    type: 2
                    , title: '编辑地区代理'
                    , content: layui.setter.views + 'agent/agentArea/edit.html?id=' + data.id
                    , maxmin: true
                    , area: ['800px', '600px']
                    , success: function(layero, index) {
                        // 确保弹窗内容加载完成后重新渲染表单
                        var iframeWin = window[layero.find('iframe')[0]['name']];
                        if (iframeWin && iframeWin.layui) {
                            iframeWin.layui.form.render();
                        }
                    }
                });
            } else if (obj.event === 'setCommission') {
                admin.popup({
                    type: 2
                    , title: '设置佣金比例'
                    , content: layui.setter.views + 'agent/agentArea/setCommission.html?id=' + data.id
                    , maxmin: true
                    , area: ['600px', '400px']
                    , success: function(layero, index) {
                        // 确保弹窗内容加载完成后重新渲染表单
                        var iframeWin = window[layero.find('iframe')[0]['name']];
                        if (iframeWin && iframeWin.layui) {
                            iframeWin.layui.form.render();
                        }
                    }
                });
            } else if (obj.event === 'viewOrders') {
                admin.popup({
                    type: 2
                    , title: '查看代理订单'
                    , content: layui.setter.views + 'agent/agentAreaOrder/index.html?agentId=' + data.agentId
                    , maxmin: true
                    , area: ['90%', '90%']
                });
            } else if (obj.event === 'setEnable') {
                var enable = $(this).data('enable');
                admin.req({
                    url: layui.setter.apiUrl + "Api/CoreCmsAgentArea/DoSetIsEnable"
                    , data: {
                        id: data.id,
                        data: enable
                    }
                    , type: 'POST'
                    , success: function (res) {
                        if (res.code === 0) {
                            table.reload('LAY-app-CoreCmsAgentArea-tableBox');
                            layer.msg(res.msg);
                        } else {
                            layer.msg(res.msg);
                        }
                    }
                });
            }
        });

        //监听头工具栏事件
        table.on('toolbar(LAY-app-CoreCmsAgentArea-tableBox)', function (obj) {
            var checkStatus = table.checkStatus(obj.config.id);
            switch (obj.event) {
                case 'addData':
                    active.addData();
                    break;
                case 'batchSettle':
                    active.batchSettle();
                    break;
            }
        });

        table.render({
            elem: '#LAY-app-CoreCmsAgentArea-tableBox'
            , url: layui.setter.apiUrl + 'Api/CoreCmsAgentArea/GetPageList'
            , method: 'POST'
            , toolbar: '#LAY-app-CoreCmsAgentArea-toolbar'
            , defaultToolbar: ['filter', 'exports', 'print', {
                title: '提示'
                , layEvent: 'LAYTABLE_TIPS'
                , icon: 'layui-icon-tips'
            }]
            , cols: [[
                { type: 'checkbox', fixed: 'left' }
                , { field: 'id', width: 80, title: 'ID', sort: true }
                , { field: 'agentName', title: '代理商名称', minWidth: 120 }
                , { field: 'areaName', title: '代理地区', minWidth: 150 }
                , {
                    field: 'areaDepth', title: '代理层级', width: 100, templet: function (d) {
                        switch (d.areaDepth) {
                            case 1:
                                return '<span class="layui-badge layui-bg-blue">省级</span>';
                            case 2:
                                return '<span class="layui-badge layui-bg-green">市级</span>';
                            case 3:
                                return '<span class="layui-badge layui-bg-orange">县级</span>';
                            default:
                                return '<span class="layui-badge layui-bg-gray">未知</span>';
                        }
                    }
                }
                , { field: 'commissionRate', title: '佣金比例(%)', width: 120, sort: true }
                , {
                    field: 'isEnable', title: '状态', width: 100, templet: function (d) {
                        return d.isEnable ? '<span class="layui-badge layui-bg-green">启用</span>' : '<span class="layui-badge layui-bg-gray">禁用</span>';
                    }
                }
                , { field: 'createTime', title: '创建时间', width: 160, sort: true }
                , { title: '操作', minWidth: 250, toolbar: '#LAY-app-CoreCmsAgentArea-tableBox-bar', fixed: "right" }
            ]]
            , page: true
            , limit: 30
            , height: 'full-220'
            , text: {
                none: '暂无相关数据'
            }
        });

    });
</script>
