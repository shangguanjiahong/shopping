<title>编辑地区代理</title>
<link rel="stylesheet" href="/lib/layui/css/layui.css">
<link rel="stylesheet" href="/lib/layuiAdmin/style/admin.css">
<link rel="stylesheet" href="/static/css/overWrite.css">
<script src="/lib/layui/layui.js"></script>
<div class="layui-form" lay-filter="LAY-app-CoreCmsAgentArea" id="LAY-app-CoreCmsAgentArea" style="padding: 20px 30px 0 0;">
    <input type="hidden" name="id" value="{{d.id}}">
    
    <div class="layui-form-item">
        <label class="layui-form-label">代理商</label>
        <div class="layui-input-inline" style="width: 300px;">
            <select name="agentId" lay-verify="required" lay-search disabled>
                <option value="">请选择代理商</option>
            </select>
        </div>
        <div class="layui-form-mid layui-word-aux">代理商信息不可修改</div>
    </div>
    
    <div class="layui-form-item">
        <label class="layui-form-label">代理层级</label>
        <div class="layui-input-inline">
            <select name="areaDepth" lay-verify="required" lay-filter="areaDepthChange" disabled>
                <option value="">请选择代理层级</option>
                <option value="1">省级代理</option>
                <option value="2">市级代理</option>
                <option value="3">县级代理</option>
            </select>
        </div>
        <div class="layui-form-mid layui-word-aux">代理层级不可修改</div>
    </div>

    <div class="layui-form-item" id="provinceSelect">
        <label class="layui-form-label">省份</label>
        <div class="layui-input-inline" style="width: 200px;">
            <select name="provinceId" lay-verify="required" disabled>
                <option value="">请选择省份</option>
            </select>
        </div>
        <div class="layui-form-mid layui-word-aux">地区信息不可修改</div>
    </div>

    <div class="layui-form-item" id="citySelect" style="display: none;">
        <label class="layui-form-label">城市</label>
        <div class="layui-input-inline" style="width: 200px;">
            <select name="cityId" disabled>
                <option value="">请选择城市</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item" id="countySelect" style="display: none;">
        <label class="layui-form-label">区县</label>
        <div class="layui-input-inline" style="width: 200px;">
            <select name="countyId" disabled>
                <option value="">请选择区县</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">佣金比例</label>
        <div class="layui-input-inline">
            <input type="number" name="commissionRate" placeholder="请输入佣金比例" autocomplete="off" class="layui-input" lay-verify="required|number" min="0" max="100" step="0.01" value="{{d.commissionRate}}">
        </div>
        <div class="layui-form-mid layui-word-aux">单位：%，范围：0-100</div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">是否启用</label>
        <div class="layui-input-block">
            <input type="checkbox" name="isEnable" lay-skin="switch" lay-text="启用|禁用" {{d.isEnable ? 'checked' : ''}}>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label">备注</label>
        <div class="layui-input-block">
            <textarea name="remark" placeholder="请输入备注信息" class="layui-textarea">{{d.remark || ''}}</textarea>
        </div>
    </div>

    <div class="layui-form-item layui-layout-admin">
        <div class="layui-input-block">
            <div class="layui-footer" style="left: 0;">
                <button class="layui-btn" lay-submit lay-filter="LAY-app-submit-CoreCmsAgentArea">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>
        </div>
    </div>
</div>

<script>
    layui.use(['form', 'layer'], function () {
        var $ = layui.$
            , admin = layui.admin
            , form = layui.form
            , layer = layui.layer;

        // 获取URL参数中的ID
        var id = layui.router().search.id;
        if (!id) {
            layer.msg('缺少参数ID');
            return;
        }

        // 加载数据
        admin.req({
            url: layui.setter.apiUrl + "Api/CoreCmsAgentArea/GetDetails"
            , data: { id: id }
            , type: 'POST'
            , success: function (res) {
                if (res.code === 0 && res.data) {
                    var data = res.data;
                    
                    // 填充表单数据
                    form.val('LAY-app-CoreCmsAgentArea', data);
                    
                    // 加载代理商列表并设置选中值
                    loadAgentList(data.agentId);
                    
                    // 根据层级显示对应的地区选择
                    showAreaSelects(data.areaDepth);
                    
                    // 加载地区数据
                    loadAreaData(data);
                } else {
                    layer.msg(res.msg || '获取数据失败');
                }
            }
        });

        // 加载代理商列表
        function loadAgentList(selectedId) {
            admin.req({
                url: layui.setter.apiUrl + "Api/CoreCmsAgent/GetAgentList"
                , type: 'POST'
                , success: function (res) {
                    if (res.code === 0 && res.data) {
                        var html = '<option value="">请选择代理商</option>';
                        layui.each(res.data, function (index, item) {
                            var selected = item.id == selectedId ? 'selected' : '';
                            html += '<option value="' + item.id + '" ' + selected + '>' + item.name + '（' + item.mobile + '）</option>';
                        });
                        $('select[name="agentId"]').html(html);
                        form.render('select');
                    }
                }
            });
        }

        // 根据层级显示地区选择
        function showAreaSelects(depth) {
            $('#citySelect, #countySelect').hide();
            if (depth >= 2) {
                $('#citySelect').show();
            }
            if (depth >= 3) {
                $('#countySelect').show();
            }
        }

        // 加载地区数据
        function loadAreaData(data) {
            // 加载省份
            admin.req({
                url: layui.setter.apiUrl + "Api/CoreCmsArea/GetProvinceList"
                , type: 'POST'
                , success: function (res) {
                    if (res.code === 0 && res.data) {
                        var html = '<option value="">请选择省份</option>';
                        layui.each(res.data, function (index, item) {
                            var selected = item.id == data.provinceId ? 'selected' : '';
                            html += '<option value="' + item.id + '" ' + selected + '>' + item.name + '</option>';
                        });
                        $('select[name="provinceId"]').html(html);
                        form.render('select');
                        
                        // 如果有城市ID，加载城市列表
                        if (data.cityId) {
                            loadCityList(data.provinceId, data.cityId, data.countyId);
                        }
                    }
                }
            });
        }

        // 加载城市列表
        function loadCityList(provinceId, selectedCityId, selectedCountyId) {
            admin.req({
                url: layui.setter.apiUrl + "Api/CoreCmsArea/GetCityList"
                , data: { parentId: provinceId }
                , type: 'POST'
                , success: function (res) {
                    if (res.code === 0 && res.data) {
                        var html = '<option value="">请选择城市</option>';
                        layui.each(res.data, function (index, item) {
                            var selected = item.id == selectedCityId ? 'selected' : '';
                            html += '<option value="' + item.id + '" ' + selected + '>' + item.name + '</option>';
                        });
                        $('select[name="cityId"]').html(html);
                        form.render('select');
                        
                        // 如果有区县ID，加载区县列表
                        if (selectedCountyId) {
                            loadCountyList(selectedCityId, selectedCountyId);
                        }
                    }
                }
            });
        }

        // 加载区县列表
        function loadCountyList(cityId, selectedCountyId) {
            admin.req({
                url: layui.setter.apiUrl + "Api/CoreCmsArea/GetCountyList"
                , data: { parentId: cityId }
                , type: 'POST'
                , success: function (res) {
                    if (res.code === 0 && res.data) {
                        var html = '<option value="">请选择区县</option>';
                        layui.each(res.data, function (index, item) {
                            var selected = item.id == selectedCountyId ? 'selected' : '';
                            html += '<option value="' + item.id + '" ' + selected + '>' + item.name + '</option>';
                        });
                        $('select[name="countyId"]').html(html);
                        form.render('select');
                    }
                }
            });
        }

        //监听提交
        form.on('submit(LAY-app-submit-CoreCmsAgentArea)', function (data) {
            var field = data.field;
            
            // 转换复选框值
            field.isEnable = field.isEnable === 'on';

            admin.req({
                url: layui.setter.apiUrl + "Api/CoreCmsAgentArea/DoEdit"
                , data: field
                , type: 'POST'
                , success: function (res) {
                    if (res.code === 0) {
                        layer.msg('编辑成功', {
                            offset: '15px'
                            , icon: 1
                            , time: 1000
                        }, function () {
                            // 刷新父页面表格数据
                            if (parent && parent.layui && parent.layui.table) {
                                parent.layui.table.reload('LAY-app-CoreCmsAgentArea-tableBox');
                            }
                            // 关闭当前弹层
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(index);
                        });
                    } else {
                        layer.msg(res.msg || '编辑失败');
                    }
                }
            });
            return false;
        });

    });
</script>
