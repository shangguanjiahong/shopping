<title>设置佣金比例</title>
<link rel="stylesheet" href="/lib/layui/css/layui.css">
<link rel="stylesheet" href="/lib/layuiAdmin/style/admin.css">
<link rel="stylesheet" href="/static/css/overWrite.css">
<script src="/lib/jquery/jquery-2.1.4.min.js"></script>
<script src="/lib/layui/layui.js"></script>
<div class="layui-form" lay-filter="LAY-app-setCommission" id="LAY-app-setCommission" style="padding: 20px 30px 0 0;">
    <input type="hidden" name="id" value="">
    
    <div class="layui-form-item">
        <label class="layui-form-label">佣金比例</label>
        <div class="layui-input-inline">
            <input type="number" name="commissionRate" lay-verify="required|number" placeholder="请输入佣金比例" class="layui-input" step="0.01" min="0" max="100">
        </div>
        <div class="layui-form-mid layui-word-aux">请输入0-100之间的数值（百分比）</div>
    </div>
    
    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn" lay-submit lay-filter="LAY-app-submit-setCommission" id="LAY-app-submit-setCommission">确认设置</button>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    layui.config({
        base: '/lib/layuiAdmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form'], function(){
    var $ = layui.$
        , admin = layui.admin
        , form = layui.form;
    
    // 获取URL参数
    function getUrlParam(name) {
        var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
        var r = window.location.search.substr(1).match(reg);
        if (r != null) return unescape(r[2]); return null;
    }
    
    var id = getUrlParam('id');
    if (id) {
        $('input[name="id"]').val(id);
        
        // 获取当前佣金比例
        admin.req({
            url: layui.setter.apiUrl + "Api/CoreCmsAgentArea/GetDetails"
            , data: { id: id }
            , type: 'POST'
            , success: function (res) {
                if (res.code === 0) {
                    form.val('LAY-app-setCommission', res.data);
                }
            }
        });
    }
    
    // 监听提交
    form.on('submit(LAY-app-submit-setCommission)', function(data){
        var field = data.field;
        
        // 转换数据类型
        field.id = parseInt(field.id);
        field.commissionRate = parseFloat(field.commissionRate);
        
        admin.req({
            url: layui.setter.apiUrl + "Api/CoreCmsAgentArea/DoSetCommission"
            , data: JSON.stringify(field)
            , type: 'POST'
            , contentType: 'application/json; charset=utf-8'
            , dataType: 'json'
            , success: function (res) {
                if (res.code === 0) {
                    parent.layer.msg(res.msg);
                    var index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                    parent.layui.table.reload('LAY-app-CoreCmsAgentArea-tableBox');
                } else {
                    layer.msg(res.msg);
                }
            }
        });
        
        return false; // 阻止表单跳转
    });
    });
});
</script>
