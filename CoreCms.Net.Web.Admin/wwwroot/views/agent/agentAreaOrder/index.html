<title>地区代理订单记录</title>
<!--当前位置开始-->
<div class="layui-card layadmin-header">
    <div class="layui-breadcrumb" lay-filter="breadcrumb">
        <script type="text/html" template lay-done="layui.data.updateMainBreadcrumb();">
        </script>
    </div>
</div>
<!--当前位置结束-->
<style>
    /* 重写样式 */
</style>
<script type="text/html" template lay-type="Post" lay-url="{{ layui.setter.apiUrl }}Api/CoreCmsAgentAreaOrder/GetIndex" lay-done="layui.data.done(d);">

</script>
<div class="table-body">
    <table id="LAY-app-CoreCmsAgentAreaOrder-tableBox" lay-filter="LAY-app-CoreCmsAgentAreaOrder-tableBox"></table>
</div>

<script type="text/html" id="LAY-app-CoreCmsAgentAreaOrder-toolbar">
    <div class="layui-form coreshop-toolbar-search-form">
        <div class="layui-form-item">
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <input type="text" name="agentName" placeholder="请输入代理商名称" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <input type="text" name="buyUserNickName" placeholder="请输入下单用户" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <input type="text" name="orderId" placeholder="请输入订单号" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <select name="areaId" id="areaId">
                        <option value="">请选择代理区域</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <select name="settleStatus">
                        <option value="">请选择结算状态</option>
                        <option value="0">未结算</option>
                        <option value="1">已结算</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline">
                    <select name="areaDepth">
                        <option value="">请选择代理层级</option>
                        <option value="1">省级代理</option>
                        <option value="2">市级代理</option>
                        <option value="3">县级代理</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <div class="layui-input-inline core-time-input">
                    <input type="text" name="createTime" id="searchTime-CoreCmsAgentAreaOrder-createTime" placeholder="请输入创建时间" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <button class="layui-btn layui-btn-sm" lay-submit lay-filter="LAY-app-CoreCmsAgentAreaOrder-search"><i class="layui-icon layui-icon-search"></i>筛选</button>
            </div>
        </div>
    </div>
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="batchSettle"><i class="layui-icon layui-icon-dollar"></i>批量结算</button>
        <button class="layui-btn layui-btn-sm layui-btn-warm" lay-event="exportData"><i class="layui-icon layui-icon-export"></i>导出数据</button>
    </div>
</script>

<script type="text/html" id="LAY-app-CoreCmsAgentAreaOrder-tableBox-bar">
    <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="detail">查看</a>
    {{# if(d.settleStatus == 0){ }}
    <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="settle">结算</a>
    {{# } else { }}
    <span class="layui-badge layui-bg-green">已结算</span>
    {{# } }}
</script>

<script>
    var indexData;
    var debug = layui.setter.debug;
    layui.data.done = function (d) {
        //开启调试情况下获取接口赋值数据
        if (debug) {
            console.log(d);
        }
        indexData = d.data;
    };

    layui.use(['table', 'form', 'layer', 'laydate'], function () {
        var $ = layui.$
            , admin = layui.admin
            , view = layui.view
            , table = layui.table
            , form = layui.form
            , layer = layui.layer
            , laydate = layui.laydate;

        admin.req({
            url: layui.setter.apiUrl + 'Api/CoreCmsAgentArea/GetIndex'
            , data: { limit: 1000 }
            , done: function (res) {
                if (res.code == 0) {
                    var html = '<option value="">请选择代理区域</option>';
                    res.data.forEach(function (item) {
                        html += '<option value="' + item.areaId + '">' + item.areaName + '</option>';
                    });
                    $('#areaId').html(html);
                    layui.form.render('select');
                }
            }
        });

        //日期
        laydate.render({
            elem: '#searchTime-CoreCmsAgentAreaOrder-createTime'
            , range: true
        });

        //监听搜索
        form.on('submit(LAY-app-CoreCmsAgentAreaOrder-search)', function (data) {
            var field = data.field;
            //执行重载
            table.reload('LAY-app-CoreCmsAgentAreaOrder-tableBox', {
                where: field
            });
        });

        //事件
        var active = {
            batchSettle: function () {
                var checkStatus = table.checkStatus('LAY-app-CoreCmsAgentAreaOrder-tableBox')
                    , checkData = checkStatus.data;

                if (checkData.length === 0) {
                    return layer.msg('请选择要结算的订单');
                }

                // 检查是否有已结算的订单
                var hasSettled = false;
                layui.each(checkData, function (index, item) {
                    if (item.settleStatus == 1) {
                        hasSettled = true;
                        return true;
                    }
                });

                if (hasSettled) {
                    return layer.msg('选中的订单中包含已结算的订单，请重新选择');
                }

                layer.confirm('确定要对选中的订单进行批量结算吗？', function (index) {
                    var ids = [];
                    layui.each(checkData, function (index, item) {
                        ids.push(item.id);
                    });
                    admin.req({
                        url: layui.setter.apiUrl + "Api/CoreCmsAgentAreaOrder/DoBatchSettle"
                        , data: {
                            ids: ids
                        }
                        , type: 'POST'
                        , success: function (res) {
                            if (res.code === 0) {
                                layer.msg(res.msg);
                                table.reload('LAY-app-CoreCmsAgentAreaOrder-tableBox');
                            } else {
                                layer.msg(res.msg);
                            }
                        }
                    });
                    layer.close(index);
                });
            },
            exportData: function () {
                layer.msg('导出功能开发中...');
            }
        };

        $('.layui-btn-container .layui-btn').on('click', function () {
            var type = $(this).data('type');
            active[type] ? active[type].call(this) : '';
        });

        //监听工具条
        table.on('tool(LAY-app-CoreCmsAgentAreaOrder-tableBox)', function (obj) {
            var data = obj.data;
            if (obj.event === 'detail') {
                view.open({
                    type: 2
                    , title: '查看订单详情'
                    , content: layui.setter.views + 'agent/agentAreaOrder/details.html?id=' + data.id
                    , maxmin: false
                    , area: ['800px', '600px']
                });
            } else if (obj.event === 'settle') {
                layer.confirm('确定要结算这笔订单吗？', function (index) {
                    admin.req({
                        url: layui.setter.apiUrl + "Api/CoreCmsAgentAreaOrder/DoSetSettleStatus"
                        , data: {
                            id: data.id,
                            data: true
                        }
                        , type: 'POST'
                        , success: function (res) {
                            if (res.code === 0) {
                                obj.update({
                                    settleStatus: 1
                                });
                                layer.msg(res.msg);
                            } else {
                                layer.msg(res.msg);
                            }
                        }
                    });
                    layer.close(index);
                });
            }
        });

        //监听头工具栏事件
        table.on('toolbar(LAY-app-CoreCmsAgentAreaOrder-tableBox)', function (obj) {
            var checkStatus = table.checkStatus(obj.config.id);
            switch (obj.event) {
                case 'batchSettle':
                    active.batchSettle();
                    break;
                case 'exportData':
                    active.exportData();
                    break;
            }
        });

        // 获取URL参数
        function getUrlParam(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return unescape(r[2]);
            return null;
        }

        var agentId = getUrlParam('agentId');
        var whereCondition = {};
        if (agentId) {
            whereCondition.agentId = agentId;
        }

        table.render({
            elem: '#LAY-app-CoreCmsAgentAreaOrder-tableBox'
            , url: layui.setter.apiUrl + 'Api/CoreCmsAgentAreaOrder/GetPageList'
            , method: 'POST'
            , where: whereCondition
            , toolbar: '#LAY-app-CoreCmsAgentAreaOrder-toolbar'
            , defaultToolbar: ['filter', 'exports', 'print', {
                title: '提示'
                , layEvent: 'LAYTABLE_TIPS'
                , icon: 'layui-icon-tips'
            }]
            , cols: [[
                { type: 'checkbox', fixed: 'left' }
                , { field: 'id', width: 80, title: 'ID', sort: true }
                , { field: 'agentName', title: '代理商', minWidth: 120 }
                , { field: 'areaName', title: '代理地区', minWidth: 120 }
                , {
                    field: 'areaDepth', title: '代理层级', width: 100, templet: function (d) {
                        switch (d.areaDepth) {
                            case 1:
                                return '<span class="layui-badge layui-bg-blue">省级</span>';
                            case 2:
                                return '<span class="layui-badge layui-bg-green">市级</span>';
                            case 3:
                                return '<span class="layui-badge layui-bg-orange">县级</span>';
                            default:
                                return '<span class="layui-badge layui-bg-gray">未知</span>';
                        }
                    }
                }
                , { field: 'buyUserNickName', title: '下单用户', minWidth: 120 }
                , { field: 'orderId', title: '订单号', minWidth: 180 }
                , {
                    field: 'money', title: '佣金金额', width: 120, sort: true, templet: function (d) {
                        return '<span style="color: #ff5722;">￥' + d.money + '</span>';
                    }
                }
                , {
                    field: 'settleStatus', title: '结算状态', width: 100, templet: function (d) {
                        return d.settleStatus == 1 ? '<span class="layui-badge layui-bg-green">已结算</span>' : '<span class="layui-badge layui-bg-orange">未结算</span>';
                    }
                }
                , { field: 'createTime', title: '创建时间', width: 160, sort: true }
                , { field: 'updateTime', title: '更新时间', width: 160, sort: true }
                , { title: '操作', minWidth: 150, toolbar: '#LAY-app-CoreCmsAgentAreaOrder-tableBox-bar', fixed: "right" }
            ]]
            , page: true
            , limit: 30
            , height: 'full-220'
            , text: {
                none: '暂无相关数据'
            }
        });

    });
</script>
